<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NeoAssist Handoff</title>

  <!-- NeoAssist shared CSS -->
  <link rel="stylesheet" href="../assets/styles.css">

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f4eee6;
    }

    #handoffApp {
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <main id="handoffApp"></main>

  <script type="module">
    import {
      render,
      init
    } from "../tools/handoff.js";

    const host = document.getElementById("handoffApp");

    host.innerHTML = render();

    await init(host);
  </script>

</body>
</html>
